<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册创也账号 - 创也智能</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ====== 主容器 ====== */
    main.register-page {
      width: 100%;
      max-width: 1480px;
      min-height: 720px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background:
        radial-gradient(circle at 8% 6%, rgba(91, 92, 226, 0.10), rgba(0, 0, 0, 0) 28%),
        radial-gradient(circle at 90% 14%, rgba(14, 165, 233, 0.08), rgba(0, 0, 0, 0) 26%),
        linear-gradient(#f8fbff, #ffffff);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 30px 86px rgba(15, 23, 42, 0.10);
      border: 1px solid rgba(15, 23, 42, 0.07);
    }

    /* ====== 左侧品牌区 ====== */
    .login-brand-panel {
      position: relative;
      padding: 36px 44px 42px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.20), rgba(15, 23, 42, 0.72)),
        url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=88");
      background-size: auto, cover;
      background-position: 0% 0%, 50% 50%;
      background-repeat: no-repeat, no-repeat;
    }

    .login-home-link {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.86);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 14px 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: background 0.2s;
      width: fit-content;
    }

    .login-home-link:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .login-brand-copy {
      position: relative;
      z-index: 2;
    }

    .login-kicker {
      display: inline-block;
      font-size: 14px;
      color: #c4b5fd;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }

    .login-brand-copy h1 {
      font-size: 72px;
      line-height: 1.1;
      font-weight: 500;
      margin-bottom: 22px;
      letter-spacing: 1px;
    }

    .login-brand-copy p {
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.86);
      max-width: 420px;
    }

    .login-brand-foot {
      position: relative;
      z-index: 2;
      color: rgba(255, 255, 255, 0.74);
    }

    .login-brand-foot strong {
      display: block;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .login-brand-foot span {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.74);
    }

    /* ====== 右侧表单区 ====== */
    .login-form-panel {
      padding: 24px 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      background: #ffffff;
      border-radius: 26px;
      padding: 28px 32px;
      box-shadow: 0 30px 86px rgba(15, 23, 42, 0.10);
      border: 1px solid rgba(15, 23, 42, 0.07);
    }

    .login-heading h2 {
      font-size: 30px;
      font-weight: 500;
      color: #111827;
      margin-bottom: 24px;
    }

    /* ====== 表单 ====== */
    .ant-form-item {
      margin-bottom: 14px;
    }

    .ant-form-item-label {
      display: block;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.88);
      font-weight: 400;
      margin-bottom: 6px;
    }

    .ant-form-item-label .required {
      color: #ef4444;
      margin-right: 4px;
    }

    .ant-input-affix-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      height: 40px;
      border: 1px solid #d9d9d9;
      border-radius: 12px;
      background: #ffffff;
      transition: all 0.2s;
    }

    .ant-input-affix-wrapper:hover {
      border-color: #5b5ce2;
    }

    .ant-input-affix-wrapper.focused {
      border-color: #5b5ce2;
      box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.10);
    }

    .ant-input-affix-wrapper.error {
      border-color: #ef4444;
    }

    .ant-input-affix-wrapper.error.focused {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.10);
    }

    .ant-input-affix-wrapper.valid {
      border-color: #10b981;
    }

    .ant-input-prefix {
      display: inline-flex;
      align-items: center;
      color: rgba(0, 0, 0, 0.45);
      font-size: 16px;
    }

    .ant-input-affix-wrapper input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.88);
      height: 100%;
      padding: 0;
    }

    .ant-input-affix-wrapper input::placeholder {
      color: rgba(0, 0, 0, 0.35);
    }

    .toggle-eye {
      cursor: pointer;
      color: rgba(0, 0, 0, 0.45);
      display: inline-flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-eye:hover {
      color: #5b5ce2;
    }

    /* ====== 注册两列网格 ====== */
    .register-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .register-form-grid .ant-form-item {
      margin-bottom: 14px;
    }

    /* ====== 提示信息 ====== */
    .form-tip {
      font-size: 12px;
      color: #ef4444;
      margin-top: 4px;
      min-height: 16px;
    }

    .form-tip.success {
      color: #10b981;
    }

    /* ====== 按钮 ====== */
    .ant-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s;
      border: 1px solid transparent;
    }

    .btn-primary {
      height: 48px;
      font-size: 16px;
      font-weight: 500;
      border-radius: 12px;
      background: #5b5ce2;
      color: #ffffff;
      border-color: #5b5ce2;
      box-shadow: 0 6px 16px rgba(91, 92, 226, 0.28);
      margin-bottom: 12px;
    }

    .btn-primary:hover:not(:disabled) {
      background: #4f46e5;
      border-color: #4f46e5;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: #c7d2fe;
      border-color: #c7d2fe;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      height: 40px;
      font-size: 14px;
      font-weight: 400;
      border-radius: 10px;
      background: #ffffff;
      color: rgba(0, 0, 0, 0.88);
      border-color: #d9d9d9;
    }

    .btn-secondary:hover {
      border-color: #5b5ce2;
      color: #5b5ce2;
    }

    /* ====== 反馈消息 ====== */
    .register-feedback {
      margin-bottom: 14px;
      min-height: 0;
      transition: min-height 0.2s;
    }

    .register-feedback.show {
      min-height: auto;
    }

    .feedback-message {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.25s ease-out;
    }

    .feedback-message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .feedback-message.success {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .feedback-message.info {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ====== 底部链接 ====== */
    .register-foot {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    .register-foot a {
      color: #5b5ce2;
      text-decoration: none;
      margin-left: 6px;
    }

    .register-foot a:hover {
      text-decoration: underline;
    }

    /* ====== Modal 弹窗 ====== */
    .ant-modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      animation: maskFade 0.2s ease-out;
    }

    .ant-modal-mask.show {
      display: flex;
    }

    @keyframes maskFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ant-modal-content {
      width: 520px;
      max-width: calc(100vw - 48px);
      background: #ffffff;
      border-radius: 10px;
      padding: 20px 24px;
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.08),
        0 3px 6px -4px rgba(0, 0, 0, 0.12),
        0 9px 28px 8px rgba(0, 0, 0, 0.05);
      animation: modalSlide 0.2s ease-out;
      position: relative;
    }

    .ant-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      background: none;
      border: none;
      color: rgba(0, 0, 0, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      padding: 0;
    }

    .ant-modal-close:hover {
      color: rgba(0, 0, 0, 0.88);
    }

    .ant-modal-header {
      margin-bottom: 12px;
      padding-right: 24px;
    }

    .ant-modal-title {
      font-size: 16px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
      line-height: 1.5;
    }

    .ant-modal-body {
      margin-bottom: 20px;
    }

    .modal-text {
      margin: 0 0 8px 0;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(0, 0, 0, 0.88);
    }

    .modal-text:last-child {
      margin-bottom: 0;
    }

    .modal-text-muted {
      color: #6b7280;
    }

    .ant-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      height: 32px;
      padding: 0 15px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.18s;
    }

    .modal-btn-cancel {
      background: #ffffff;
      color: rgba(0, 0, 0, 0.88);
      border: 1px solid #d9d9d9;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.02);
    }

    .modal-btn-cancel:hover {
      border-color: #5b5ce2;
      color: #5b5ce2;
    }

    .modal-btn-confirm {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid transparent;
      box-shadow: 0 2px 0 rgba(5, 122, 255, 0.06);
    }

    .modal-btn-confirm:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .modal-btn-confirm:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    /* ====== 响应式 ====== */
    @media (max-width: 900px) {
      main.register-page {
        grid-template-columns: 1fr;
        max-width: 460px;
        min-height: auto;
      }
      .login-brand-panel {
        min-height: 220px;
        padding: 24px 28px;
      }
      .login-brand-copy h1 {
        font-size: 36px;
      }
      .login-form-panel {
        padding: 20px;
      }
    }

    @media (max-width: 520px) {
      .register-form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    /* ====== 图标 ====== */
    .icon {
      width: 1em;
      height: 1em;
      fill: currentColor;
      vertical-align: -0.125em;
    }
  </style>
</head>
<body>
  <main class="register-page" role="main">
    <!-- 左侧品牌区 -->
    <section class="login-brand-panel" aria-label="品牌介绍">
      <a class="login-home-link" href="/">
        <svg class="icon" viewBox="64 64 896 896" aria-hidden="true">
          <path d="M872 474H286.9l350.2-304c5.6-4.9 2.2-14-5.2-14h-88.5c-3.9 0-7.6 1.4-10.5 3.9L155 487.8a31.96 31.96 0 000 48.3L535.1 866c1.5 1.3 3.3 2 5.2 2h91.5c7.4 0 10.8-9.2 5.2-14L286.9 550H872c4.4 0 8-3.6 8-8v-60c0-4.4-3.6-8-8-8z"></path>
        </svg>
        返回首页
      </a>

      <div class="login-brand-copy">
        <span class="login-kicker">YeiYei AI · 创也智能</span>
        <h1>创见，也为你</h1>
        <p>面向 OZON / Wildberries 本土&amp;跨境电商卖家的智能经营系统。</p>
      </div>

      <div class="login-brand-foot">
        <strong>YeiYei AI</strong>
        <span>看清利润，看懂经营</span>
      </div>
    </section>

    <!-- 右侧表单区 -->
    <section class="login-form-panel" aria-label="注册表单">
      <div class="login-card">
        <div class="login-heading">
          <h2>注册创也账号</h2>
        </div>

        <form id="registerForm" autocomplete="off" novalidate>
          <div class="register-feedback" id="feedback" aria-live="polite"></div>

          <!-- 公司名称 -->
          <div class="ant-form-item">
            <label class="ant-form-item-label" for="company">
              <span class="required">*</span>公司名称
            </label>
            <div class="ant-input-affix-wrapper" data-field="company">
              <span class="ant-input-prefix">
                <svg class="icon" viewBox="64 64 896 896" aria-hidden="true">
                  <path d="M894 462c30.9 0 43.8-39.7 18.7-58L530.8 126.2a31.81 31.81 0 00-37.6 0L111.3 404c-25.1 18.2-12.2 58 18.8 58H192v374h-72c-4.4 0-8 3.6-8 8v52c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-52c0-4.4-3.6-8-8-8h-72V462h62zM512 196.7l271.1 197.2H240.9L512 196.7zM264 462h117v374H264V462zm189 0h117v374H453V462zm307 374H642V462h118v374z"></path>
                </svg>
              </span>
              <input
                id="company"
                name="company"
                type="text"
                autocomplete="organization"
                placeholder="请输入公司或经营主体名称"
                required
              />
            </div>
            <div class="form-tip" id="tip-company"></div>
          </div>

          <!-- 联系人 + 联系电话 -->
          <div class="register-form-grid">
            <div class="ant-form-item">
              <label class="ant-form-item-label" for="contactName">
                <span class="required">*</span>联系人
              </label>
              <div class="ant-input-affix-wrapper" data-field="contactName">
                <span class="ant-input-prefix">
                  <svg class="icon" viewBox="64 64 896 896" aria-hidden="true">
                    <path d="M300 512a128 128 0 1 0 128-128 128 128 0 0 0-128 128zm148.8-145.6a17.6 17.6 0 1 1-17.6 17.6 17.6 17.6 0 0 1 17.6-17.6zM858 512a128 128 0 1 0-128 128 128 128 0 0 0 128-128zm-148.8-145.6a17.6 17.6 0 1 1-17.6 17.6 17.6 17.6 0 0 1 17.6-17.6zM572 512a128 128 0 1 0-128 128 128 128 0 0 0 128-128zm-148.8-145.6a17.6 17.6 0 1 1-17.6 17.6 17.6 17.6 0 0 1 17.6-17.6z"></path>
                  </svg>
                </span>
                <input
                  id="contactName"
                  name="contactName"
                  type="text"
                  autocomplete="name"
                  placeholder="请输入联系人姓名"
                  required
                />
              </div>
              <div class="form-tip" id="tip-contactName"></div>
            </div>

            <div class="ant-form-item">
              <label class="ant-form-item-label" for="phone">
                <span class="required">*</span>联系电话
              </label>
              <div class="ant-input-affix-wrapper" data-field="phone">
                <span class="ant-input-prefix">
                  <svg class="icon" viewBox="64 64 896 896" aria-hidden="true">
                    <path d="M877.1 401.4L743 374.3a32 32 0 0 0-33.5 13.6l-58.1 102.8a32 32 0 0 1-39.1 14.7 397.3 397.3 0 0 1-176.8-176.8 32 32 0 0 1 14.7-39.1l102.8-58.1a32 32 0 0 0 13.6-33.5L541.2 146.9a32 32 0 0 0-37.6-22.7C387.2 150.6 256 357.3 256 512c0 205.9 166.1 372 372 372 154.7 0 361.4-131.2 387.8-247.6a32 32 0 0 0-22.7-37.6zM628 512a116 116 0 1 1-116-116 116 116 0 0 1 116 116z"></path>
                  </svg>
                </span>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  autocomplete="tel"
                  placeholder="请输入手机号"
                  maxlength="11"
                  required
                />
              </div>
              <div class="form-tip" id="tip-phone"></div>
            </div>
          </div>

          <!-- 账号名 -->
          <div class="ant-form-item">
            <label class="ant-form-item-label" for="username">
              <span class="required">*</span>账号名
            </label>
            <div class="ant-input-affix-wrapper" data-field="username">
              <span class="ant-input-prefix">
                <svg class="icon" viewBox="64 64 896 896" aria-hidden="true">
                  <path d="M858.5 763.6a374 374 0 0 0-80.6-119.5 375.6 375.6 0 0 0-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137.2-111.3-248.5-248.5-248.5S263.1 224.8 263.1 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5a375.6 375.6 0 0 0-119.5 80.6 374 374 0 0 0-80.6 119.5c-1.6 4.1-3.2 8.3-4.7 12.5A371.2 38 0 0 0 152 864a8 8 0 0 0 8 8h688a8 8 0 0 0 8-8c0-22.2-1.8-44.2-5.2-65.9a371.2 371.2 0 0 0-13.3-32.5zM512 160a202 202 0 1 1-202 202 202 202 0 0 1 202-202z"></path>
                </svg>
              </span>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="用于登录系统"
                required
              />
            </div>
            <div class="form-tip" id="tip-username"></div>
          </div>

          <!-- 密码 -->
          <div class="ant-form-item">
            <label class="ant-form-item-label" for="password">
              <span class="required">*</span>密码
            </label>
            <div class="ant-input-affix-wrapper" data-field="password">
              <span class="ant-input-prefix">
                <svg class="icon" viewBox="64 64 896 896" aria-hidden="true">
                  <path d="M832 464h-68V240c0-70.6-57.4-128-128-128H388c-70.6 0-128 57.4-128 128v224h-68c-17.7 0-32 14.3-32 32v384c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V496c0-17.7-14.3-32-32-32zM332 240c0-30.9 25.1-56 56-56h248c30.9 0 56 25.1 56 56v224H332V240zm460 600H-256V496h680v344zM484 701v53c0 4.4 3.6 8 8 8h40c4.4 0 8-3.6 8-8v-53a48.01 48.01 0 1 0-56 0z"></path>
                </svg>
              </span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="至少 8 位，含字母和数字"
                required
              />
              <span class="toggle-eye" id="togglePassword" aria-label="显示/隐藏密码">
                <svg class="icon" viewBox="64 64 896 896" aria-hidden="true">
                  <path d="M942.2 486.2Q829.1 314 696.4 314.5t-245.8 171.7q-7.7 12.3-7.7 25.7t7.7 25.7Q563.4 710 696.4 710t245.8-171.7q7.7-12.3 7.7-25.7t-7.7-25.7zM696.4 618.3q-66.3 0-113.2-46.8T536.4 458.5q0-66.3 46.8-113.2t113.2-46.8 113.2 46.8 46.8 113.2q0 66.3-46.8 113.2t-113.2 46.8zM396.8 458.5a299.6 299.6 0 0 0 299.6 299.6 299.6 299.6 0 0 0 299.6-299.6 299.6 299.6 0 0 0-299.6-299.6 299.6 299.6 0 0 0-299.6 299.6z"></path>
                  <path d="M508.6 458.5a188.8 188.8 0 0 0 187.8 187.8 188.8 188.8 0 0 0 187.8-187.8 188.8 188.8 0 0 0-187.8-187.8 188.8 188.8 0 0 0-187.8 187.8z"></path>
                </svg>
              </span>
            </div>
            <div class="form-tip" id="tip-password"></div>
          </div>

          <!-- 按钮：上下堆叠 -->
          <button type="submit" class="ant-btn btn-primary" id="submitBtn">
            <span>注 册</span>
          </button>
          <button type="button" class="ant-btn btn-secondary" id="trialBtn">
            <svg class="icon" viewBox="64 64 896 896" aria-hidden="true" style="font-size:14px;">
              <path d="M880 256H144c-17.7 0-32 14.3-32 32v448c0 17.7 14.3 32 32 32h736c17.7 0 32-14.3 32-32V288c0-17.7-14.3-32-32-32zm-40 432H184V328h656v360zM304 408h416v48H304zm0 96h416v48H304zm0 96h256v48H304z"></path>
            </svg>
            <span>7天免费体验</span>
          </button>

          <div class="register-foot">
            已有账号？<a href="/login">返回登录</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- 开通 7 天免费体验确认弹窗 -->
  <div class="ant-modal-mask" id="trialModal" aria-hidden="true">
    <div class="ant-modal-content" role="dialog" aria-labelledby="trialModalTitle">
      <button type="button" class="ant-modal-close" id="trialModalClose" aria-label="关闭">
        <svg class="icon" viewBox="64 64 896 896" aria-hidden="true" style="font-size:14px;">
          <path d="M563.8 512l262.5-312.9c4.4-5.2.7-13.1-6.1-13.1h-79.8c-4.7 0-9.2 2.1-12.3 5.7L488 480.6 344.2 191.7c-3-3.6-7.5-5.7-12.3-5.7H252c-6.8 0-10.5 7.9-6.1 13.1L460.4 512 197.9 824.9c-4.4 5.2-.7 13.1 6.1 13.1h79.8c4.7 0 9.2-2.1 12.3-5.7L488 543.4l143.8 169.1c3 3.6 7.5 5.7 12.3 5.7h79.8c6.8 0 10.5-7.9 6.1-13.1L563.8 512z"></path>
        </svg>
      </button>
      <div class="ant-modal-header">
        <div class="ant-modal-title" id="trialModalTitle">开通 7 天免费体验</div>
      </div>
      <div class="ant-modal-body">
        <p class="modal-text">确认开启 7 天免费体验吗？系统将立刻创建租户、开通 1 个店铺授权，您可以直接进入系统使用全部功能。</p>
        <p class="modal-text modal-text-muted">体验期结束后如未续费，账号将无法继续访问。到期前请在「全局设置 → 租户到期」处查看剩余天数。</p>
      </div>
      <div class="ant-modal-footer">
        <button type="button" class="modal-btn modal-btn-cancel" id="trialModalCancel">取 消</button>
        <button type="button" class="modal-btn modal-btn-confirm" id="trialModalConfirm">确认开通</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const $ = (sel, root = document) => root.querySelector(sel);

      const form = $('#registerForm');
      const feedback = $('#feedback');
      const submitBtn = $('#submitBtn');

      const validators = {
        company(v) {
          if (!v.trim()) return '请输入公司名称';
          if (v.trim().length < 2) return '公司名称至少 2 个字符';
          if (v.trim().length > 50) return '公司名称不能超过 50 个字符';
          return '';
        },
        contactName(v) {
          if (!v.trim()) return '请输入联系人姓名';
          if (v.trim().length < 2) return '姓名至少 2 个字符';
          return '';
        },
        phone(v) {
          const value = v.trim();
          if (!value) return '请输入手机号';
          if (!/^1[3-9]\d{9}$/.test(value)) return '请输入正确的 11 位手机号';
          return '';
        },
        username(v) {
          const value = v.trim();
          if (!value) return '请输入账号名';
          if (value.length < 4) return '账号名至少 4 个字符';
          if (value.length > 20) return '账号名不能超过 20 个字符';
          if (!/^[a-zA-Z][a-zA-Z0-9_]*$/.test(value)) return '以字母开头，仅含字母、数字、下划线';
          return '';
        },
        password(v) {
          if (!v) return '请输入密码';
          if (v.length < 8) return '密码至少 8 位';
          if (v.length > 32) return '密码不能超过 32 位';
          if (!/[a-zA-Z]/.test(v) || !/\d/.test(v)) return '密码需同时包含字母和数字';
          return '';
        },
      };

      function showFeedback(type, message) {
        feedback.classList.add('show');
        feedback.innerHTML = `<div class="feedback-message ${type}">${message}</div>`;
      }

      function clearFeedback() {
        feedback.classList.remove('show');
        feedback.innerHTML = '';
      }

      function setFieldState(field, message, isError) {
        const wrapper = $(`.ant-input-affix-wrapper[data-field="${field}"]`);
        const tipEl = $(`#tip-${field}`);
        wrapper.classList.remove('error', 'valid', 'focused');
        if (message) {
          wrapper.classList.add(isError ? 'error' : 'valid');
        }
        if (tipEl) {
          tipEl.textContent = message || '';
          tipEl.classList.toggle('success', !!message && !isError);
        }
      }

      function clearFieldState(field) {
        const wrapper = $(`.ant-input-affix-wrapper[data-field="${field}"]`);
        const tipEl = $(`#tip-${field}`);
        wrapper.classList.remove('error', 'valid');
        if (tipEl) tipEl.textContent = '';
      }

      function validateField(field) {
        const input = $(`#${field}`);
        const message = validators[field](input.value);
        if (message) {
          setFieldState(field, message, true);
          return false;
        }
        setFieldState(field, '✓ 通过', false);
        return true;
      }

      function validateAll() {
        const fields = Object.keys(validators);
        let allValid = true;
        let firstInvalid = null;
        for (const field of fields) {
          const valid = validateField(field);
          if (!valid) {
            allValid = false;
            if (!firstInvalid) firstInvalid = field;
          }
        }
        if (firstInvalid) $(`#${firstInvalid}`).focus();
        return allValid;
      }

      function initPasswordToggle() {
        const toggle = $('#togglePassword');
        const input = $('#password');
        let visible = false;
        toggle.addEventListener('click', () => {
          visible = !visible;
          input.type = visible ? 'text' : 'password';
          toggle.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
        });
      }

      function collectFormData() {
        return {
          company: $('#company').value.trim(),
          contactName: $('#contactName').value.trim(),
          phone: $('#phone').value.trim(),
          username: $('#username').value.trim(),
          password: $('#password').value,
        };
      }

      function simulateRegister(data) {
        return new Promise((resolve) => {
          setTimeout(() => {
            if (data.username === 'admin') {
              resolve({ ok: false, message: '该账号名已被占用，请更换一个' });
            } else {
              resolve({ ok: true, message: `注册成功！欢迎 ${data.contactName}` });
            }
          }, 600);
        });
      }

      async function handleSubmit(e) {
        e.preventDefault();
        clearFeedback();
        if (!validateAll()) {
          showFeedback('error', '请检查并完善表单内容');
          return;
        }
        const data = collectFormData();
        submitBtn.disabled = true;
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span>注册中...</span>';
        try {
          const result = await simulateRegister(data);
          if (result.ok) {
            showFeedback('success', result.message);
          } else {
            showFeedback('error', result.message);
            setFieldState('username', result.message, true);
          }
        } catch (err) {
          showFeedback('error', '注册失败，请稍后再试');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      }

      function handleTrial() {
        const phone = $('#phone').value.trim();
        if (phone && validators.phone(phone)) {
          // 有 phone 但格式不正确
          setFieldState('phone', '请输入正确的手机号后再申请体验', true);
          $('#phone').focus();
          return;
        }
        if (phone) {
          setFieldState('phone', '', false);
        }
        clearFeedback();
        openTrialModal();
      }

      function maskPhone(phone) {
        return phone.replace(/^(\d{3})\d{4}(\d{4})$/, '$1****$2');
      }

      // ====== 体验弹窗 ======
      const trialModal = $('#trialModal');
      const trialConfirmBtn = $('#trialModalConfirm');
      let trialConfirming = false;

      function openTrialModal() {
        trialModal.classList.add('show');
        trialModal.setAttribute('aria-hidden', 'false');
      }

      function closeTrialModal() {
        trialModal.classList.remove('show');
        trialModal.setAttribute('aria-hidden', 'true');
      }

      function simulateOpenTrial(data) {
        return new Promise((resolve) => {
          setTimeout(() => {
            const used = data.phone === '13900000000';
            if (used) {
              resolve({ ok: false, message: '该手机号已开通过 7 天免费体验' });
            } else {
              resolve({
                ok: true,
                message: `体验已开通！租户与 1 个店铺授权已创建，立即进入系统...`,
              });
            }
          }, 800);
        });
      }

      async function handleTrialConfirm() {
        if (trialConfirming) return;
        const data = collectFormData();
        if (!data.company || !data.contactName || !data.phone || !data.username || !data.password) {
          showFeedback('error', '请先填写完整注册信息再开通体验');
          closeTrialModal();
          return;
        }
        if (!validateAll()) {
          showFeedback('error', '请检查并完善表单内容');
          closeTrialModal();
          return;
        }
        trialConfirming = true;
        trialConfirmBtn.disabled = true;
        const originalText = trialConfirmBtn.innerText;
        trialConfirmBtn.innerText = '开通中...';
        try {
          const result = await simulateOpenTrial(data);
          if (result.ok) {
            closeTrialModal();
            showFeedback('success', result.message);
          } else {
            showFeedback('error', result.message);
            setFieldState('phone', result.message, true);
            closeTrialModal();
          }
        } catch (err) {
          showFeedback('error', '体验开通失败，请稍后再试');
          closeTrialModal();
        } finally {
          trialConfirming = false;
          trialConfirmBtn.disabled = false;
          trialConfirmBtn.innerText = originalText;
        }
      }

      function bindEvents() {
        Object.keys(validators).forEach((field) => {
          const input = $(`#${field}`);
          input.addEventListener('blur', () => {
            if (input.value) validateField(field);
          });
          input.addEventListener('input', () => clearFieldState(field));
          input.addEventListener('focus', () => {
            const wrapper = $(`.ant-input-affix-wrapper[data-field="${field}"]`);
            wrapper.classList.add('focused');
            const tipEl = $(`#tip-${field}`);
            if (tipEl && wrapper.classList.contains('error')) tipEl.textContent = '';
          });
        });
        form.addEventListener('submit', handleSubmit);
        $('#trialBtn').addEventListener('click', handleTrial);
        initPasswordToggle();

        // 体验弹窗
        $('#trialModalClose').addEventListener('click', closeTrialModal);
        $('#trialModalCancel').addEventListener('click', closeTrialModal);
        $('#trialModalConfirm').addEventListener('click', handleTrialConfirm);
        trialModal.addEventListener('click', (e) => {
          if (e.target === trialModal) closeTrialModal();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && trialModal.classList.contains('show')) {
            closeTrialModal();
          }
        });
      }

      bindEvents();
    })();
  </script>
</body>
</html>
