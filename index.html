<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创也·乾坤 产品演示页面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: rgba(0, 0, 0, 0.88);
      -webkit-font-smoothing: antialiased;
      background: #f5f7fa;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    .hero {
      text-align: center;
      margin-bottom: 56px;
    }

    .brand-mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #344054, #1f2937);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 15px;
      color: rgba(0, 0, 0, 0.55);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 48px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: #ffffff;
      border: 1px solid #e7ebf3;
      border-radius: 12px;
      padding: 28px 24px;
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      border-color: #344054;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      color: #344054;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.88);
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.55);
      line-height: 1.6;
      flex: 1;
      margin-bottom: 16px;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #5b5ce2;
      font-size: 14px;
      font-weight: 500;
    }

    .card-link::after {
      content: "→";
      transition: transform 0.2s;
    }

    .card:hover .card-link::after {
      transform: translateX(4px);
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      background: #fff1f0;
      color: #d4380d;
      border: 1px solid #ffccc7;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .footer {
      text-align: center;
      padding: 24px 0;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.35);
      border-top: 1px solid #e7ebf3;
    }

    .footer a { color: #5b5ce2; }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <div class="brand-mark">Y</div>
      <h1>创也·乾坤 产品演示</h1>
      <p>AI 电商运营平台 — 静态页面演示集合，点击下方卡片进入各页面</p>
    </header>

    <div class="grid">
      <a class="card" href="register.html">
        <div class="card-icon">
          <svg viewBox="64 64 896 896" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M912 190h-69.9c-9.8 0-19.1 4.4-25.1 12L578 512 372.3 322.6c-6.1-7.5-15.4-12-25.1-12H277c-10.7 0-16 12.9-8.3 20.1L487.9 587c6 7.4 15.1 11.8 24.6 11.8s18.6-4.4 24.6-11.8L920.3 210.1c7.7-7.2 2.4-20.1-8.3-20.1z"></path>
          </svg>
        </div>
        <div class="card-title">注册页面</div>
        <div class="card-desc">新用户注册流程，包括企业信息、联系信息、账号设置和 7 天免费体验申请。</div>
        <span class="card-link">访问页面</span>
      </a>

      <a class="card" href="settings.html">
        <div class="card-icon">
          <svg viewBox="64 64 896 896" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M600.7 364.3c-25.1-25.1-65.8-25.1-90.9 0l-30.1 30.1c-46.7 46.7-46.7 122.4 0 169.1l81.5 81.5c46.7 46.7 122.4 46.7 169.1 0L775 599.6c25.1-25.1 25.1-65.8 0-90.9l-30.1-30.1c-25.1-25.1-65.8-25.1-90.9 0L632.9 499.7c-7.6 7.6-19.8 7.6-27.4 0l-30.1-30.1c-7.6-7.6-7.6-19.8 0-27.4l21.1-21.1c25.1-25.1 25.1-65.8 0-90.9zM256 96c-35.3 0-64 28.7-64 64v704c0 35.3 28.7 64 64 64h512c35.3 0 64-28.7 64-64V160c0-35.3-28.7-64-64-64H256z"></path>
          </svg>
        </div>
        <div class="card-title">全局设置</div>
        <div class="card-desc">店铺设置、平台配置、AI 服务参数，新增店铺和租户到期管理。</div>
        <span class="card-link">访问页面</span>
      </a>

      <a class="card" href="tenants.html">
        <div class="card-icon">
          <svg viewBox="64 64 896 896" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"></path>
          </svg>
        </div>
        <div class="card-title">租户管理</div>
        <div class="card-desc">租户列表、渠道来源（俄小满 / 物流商 / 货源商）管理，新增 / 编辑 / 配置权限。</div>
        <span class="card-link">访问页面</span>
      </a>

      <a class="card" href="subscribe.html">
        <div class="tag">⚠️ 已过期</div>
        <div class="card-icon" style="background: linear-gradient(135deg, #fff1f0, #fff5f5); color: #d4380d;">
          <svg viewBox="64 64 896 896" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm-32 232c0-4.4 3.6-8 8-8h48c4.4 0 8 3.6 8 8v272c0 4.4-3.6 8-8 8h-48c-4.4 0-8-3.6-8-8V296zm32 440a48.01 48.01 0 010-96 48.01 48.01 0 010 96z"></path>
          </svg>
        </div>
        <div class="card-title">续费引导</div>
        <div class="card-desc">会员过期后的续费引导页，套餐选择、店铺数量配置和微信扫码支付。</div>
        <span class="card-link">访问页面</span>
      </a>
    </div>

    <footer class="footer">
      创也·乾坤 · AI 电商运营平台 · <a href="https://github.com/qigang2026/yeiyeiai" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>
</body>
</html>
